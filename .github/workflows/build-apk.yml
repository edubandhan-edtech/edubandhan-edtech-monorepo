name: Build EduBandhan Android APK

on:
  push:
    branches:
      - main
      - stage.v1.0.0
    paths:
      - 'edubandhan_code/frontend/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Frontend Dependencies
        working-directory: edubandhan_code/frontend
        run: npm install

      - name: Compile React 19 Bundle
        working-directory: edubandhan_code/frontend
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: edubandhan_code/frontend
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        working-directory: edubandhan_code/frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload EduBandhan APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduBandhan-Android-APK
          path: edubandhan_code/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
